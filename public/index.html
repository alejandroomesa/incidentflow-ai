<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-800 bg-slate-950 text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6 lg:px-8">
      <a href="#/incidents" class="group flex items-center gap-3" id="brand-link" aria-label="Ir al panel de incidencias">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 shadow-lg shadow-indigo-950/30">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3 4.5 6v5.3c0 4.6 3.1 8.8 7.5 9.7 4.4-.9 7.5-5.1 7.5-9.7V6L12 3Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </span>
        <span>
          <span class="flex items-center gap-2">
            <span class="text-base font-semibold tracking-tight sm:text-lg">IncidentFlow AI</span>
            <span class="rounded-full border border-indigo-400/30 bg-indigo-400/10 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-indigo-300">Demo</span>
          </span>
          <span id="brand-tagline" class="hidden text-xs text-slate-400 sm:block">Privacidad, trazabilidad y supervisión humana</span>
        </span>
      </a>
      <div class="flex items-center gap-2">
        <div class="flex rounded-lg border border-slate-700 bg-slate-900 p-0.5" aria-label="Language selector">
          <button type="button" data-language="es" class="language-button rounded-md px-2.5 py-1 text-xs font-semibold transition">ES</button>
          <button type="button" data-language="en" class="language-button rounded-md px-2.5 py-1 text-xs font-semibold transition">EN</button>
        </div>
        <div class="hidden items-center gap-2 rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-1.5 text-xs font-medium text-emerald-300 sm:flex">
          <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,.7)]"></span>
          <span id="system-status">Sistema operativo</span>
        </div>
      </div>
    </div>
  </header>
  <main id="app" class="mx-auto min-h-[calc(100vh-126px)] max-w-7xl px-4 py-7 sm:px-6 lg:px-8 lg:py-10" aria-live="polite"></main>
  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-5 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
      <p id="footer-product">IncidentFlow AI · Clasificación asistida de incidencias</p>
      <p id="footer-human">Las decisiones sensibles requieren aprobación humana.</p>
    </div>
  </footer>
  <script src="app.js"></script>
